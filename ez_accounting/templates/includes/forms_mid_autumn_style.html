<style>
/* Mid-Autumn Festival dress for Express Sales. The decorations are CSS-only
   so the accounting page stays fast, self-contained, and printable without
   pulling seasonal artwork from a third party. */
body.forms-portal-dark .mid-autumn-hero {
	position: relative;
	overflow: hidden;
	isolation: isolate;
	min-height: 9.5rem;
	padding: 2rem 10.5rem 2rem 2.25rem;
	background:
		linear-gradient(135deg, #21152f 0%, #392040 52%, #672b35 100%);
	border: 1px solid rgba(225, 174, 83, 0.5);
	box-shadow: 0 0.8rem 2.2rem rgba(14, 7, 24, 0.3);
}

body.forms-portal-dark .mid-autumn-hero::before {
	content: "";
	position: absolute;
	top: 1.25rem;
	right: 4rem;
	width: 6.5rem;
	height: 6.5rem;
	border-radius: 50%;
	/* one realistic full moon: grey maria and craters over a pale surface,
	   limb darkening at the edge, and a soft halo */
	background:
		radial-gradient(circle at 34% 30%, rgba(150, 140, 120, 0.55) 0 7%, transparent 8%),
		radial-gradient(circle at 58% 24%, rgba(150, 140, 120, 0.5) 0 9%, transparent 10%),
		radial-gradient(circle at 66% 52%, rgba(140, 130, 112, 0.55) 0 12%, transparent 13%),
		radial-gradient(circle at 40% 58%, rgba(150, 140, 120, 0.5) 0 10%, transparent 11%),
		radial-gradient(circle at 50% 78%, rgba(160, 150, 130, 0.45) 0 6%, transparent 7%),
		radial-gradient(circle at 24% 52%, rgba(165, 155, 135, 0.4) 0 4%, transparent 5%),
		radial-gradient(circle at 76% 30%, rgba(165, 155, 135, 0.4) 0 3.5%, transparent 4.5%),
		radial-gradient(circle at 36% 32%, #fffdf2 0%, #f1ead6 40%, #d9cfb6 75%, #b3a686 100%);
	box-shadow: inset -0.5rem -0.4rem 1rem rgba(90, 80, 60, 0.35), 0 0 1.6rem rgba(255, 244, 205, 0.6), 0 0 4rem rgba(255, 230, 160, 0.25);
	z-index: -1;
}

body.forms-portal-dark .mid-autumn-hero::after {
	content: "中秋快乐 · Happy Mid-Autumn Festival";
	display: block;
	margin-top: 0.85rem;
	color: #f6d590;
	font-size: 0.82rem;
	font-weight: 600;
	letter-spacing: 0.12em;
	text-transform: uppercase;
}

body.forms-portal-dark .mid-autumn-hero h1,
body.forms-portal-dark .mid-autumn-hero h1 a {
	color: #fff3ce;
	text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
}

body.forms-portal-dark .mid-autumn-hero .dashboard-subtitle {
	color: #ead9cf;
}

body.forms-portal-dark .festival-mooncakes {
	position: absolute;
	right: 1rem;
	bottom: 0.55rem;
	display: flex;
	align-items: flex-end;
	gap: 0.15rem;
	padding: 0.25rem 0.4rem 0.15rem;
	border-radius: 50% 50% 0.6rem 0.6rem / 30% 30% 0.6rem 0.6rem;
	background: linear-gradient(180deg, rgba(227, 180, 91, 0.9), rgba(160, 110, 45, 0.9));
	box-shadow: 0 0.3rem 0.8rem rgba(0, 0, 0, 0.4);
	z-index: 2;
	pointer-events: none;
}

/* a baked mooncake: scalloped rim, stamped ring and flower, glossy top */
body.forms-portal-dark .festival-mooncakes i {
	display: block;
	width: 2rem;
	height: 2rem;
	border-radius: 50%;
	background:
		radial-gradient(circle at 50% 50%, #7a4318 0 9%, transparent 10%),
		repeating-conic-gradient(from 0deg at 50% 50%, #8a4b1c 0 12deg, transparent 12deg 45deg) center / 46% 46% no-repeat,
		radial-gradient(circle at 50% 50%, transparent 0 40%, rgba(90, 45, 12, 0.7) 41% 46%, transparent 47%),
		radial-gradient(circle at 36% 30%, #f0b567 0%, #c9803a 45%, #93521f 100%);
	box-shadow: inset 0 0 0 0.12rem #a8641f, inset -0.2rem -0.25rem 0.4rem rgba(70, 30, 5, 0.45), 0 0.12rem 0.25rem rgba(0, 0, 0, 0.35);
}

body.forms-portal-dark .festival-mooncakes i:nth-child(2) {
	width: 2.4rem;
	height: 2.4rem;
	margin-bottom: 0.25rem;
}

body.forms-portal-dark .festival-lantern {
	position: absolute;
	top: -0.15rem;
	width: 1.85rem;
	height: 2.35rem;
	border-radius: 48% 48% 42% 42%;
	background: repeating-linear-gradient(90deg, #a91f2d 0 0.3rem, #d64a3d 0.3rem 0.55rem);
	border-top: 0.22rem solid #e3b45b;
	border-bottom: 0.22rem solid #e3b45b;
	box-shadow: 0 0 1rem rgba(220, 70, 55, 0.45);
}

body.forms-portal-dark .festival-lantern::before {
	content: "";
	position: absolute;
	left: 50%;
	top: -1.2rem;
	height: 1.2rem;
	border-left: 1px solid #d9b569;
}

body.forms-portal-dark .festival-lantern::after {
	content: "";
	position: absolute;
	left: 50%;
	top: 100%;
	height: 0.8rem;
	border-left: 2px solid #d9b569;
}

body.forms-portal-dark .festival-lantern-left {
	left: 72%;
}

body.forms-portal-dark .festival-lantern-right {
	right: 1.15rem;
	top: 0.8rem;
	transform: scale(0.78);
}

body.forms-portal-dark .festival-rabbit {
	position: absolute;
	right: 9.2rem;
	bottom: 0.45rem;
	width: 3.4rem;
	height: 3.6rem;
	z-index: 2;
	pointer-events: none;
	filter: drop-shadow(0 0 0.5rem rgba(255, 255, 255, 0.45));
	animation: festival-rabbit-hop 2.8s ease-in-out infinite;
}

body.forms-portal-dark .festival-rabbit svg,
body.forms-portal-dark .festival-osmanthus svg {
	width: 100%;
	height: 100%;
	overflow: visible;
}

body.forms-portal-dark .festival-rabbit .fr-ear {
	transform-box: fill-box;
	transform-origin: 50% 100%;
	animation: festival-rabbit-ear 2.8s ease-in-out infinite;
}

/* osmanthus (桂花) sprigs: tiny golden four-petal florets on leafy twigs */
body.forms-portal-dark .festival-osmanthus {
	position: absolute;
	top: 0;
	right: 0.4rem;
	width: 8.5rem;
	height: 5.5rem;
	z-index: 0;
	pointer-events: none;
	filter: drop-shadow(0 0 0.35rem rgba(255, 200, 80, 0.5));
}

body.forms-portal-dark .festival-osmanthus .fo-bloom {
	animation: festival-change-twinkle 3.2s ease-in-out infinite;
}

body.forms-portal-dark .festival-osmanthus .fo-bloom:nth-of-type(2n) {
	animation-delay: -1.1s;
}

body.forms-portal-dark .festival-osmanthus .fo-bloom:nth-of-type(3n) {
	animation-delay: -2.1s;
}

@keyframes festival-rabbit-hop {
	0%, 100% { transform: translateY(0); }
	50% { transform: translateY(-0.35rem); }
}

@keyframes festival-rabbit-ear {
	0%, 100% { transform: rotate(0deg); }
	50% { transform: rotate(-9deg); }
}

body.forms-portal-dark .festival-change {
	position: absolute;
	top: 0.4rem;
	right: 7.6rem;
	width: 9.5rem;
	height: 9.5rem;
	z-index: 1;
	pointer-events: none;
	filter: drop-shadow(0 0 0.8rem rgba(255, 214, 140, 0.55));
	animation: festival-change-fly 5s ease-in-out infinite;
}

body.forms-portal-dark .festival-change svg {
	width: 100%;
	height: 100%;
	overflow: visible;
}

body.forms-portal-dark .festival-change .fc-ribbon {
	transform-box: fill-box;
	transform-origin: 100% 50%;
	animation: festival-change-wave 2.4s ease-in-out infinite;
}

body.forms-portal-dark .festival-change .fc-ribbon-b {
	animation-delay: -1.2s;
}

body.forms-portal-dark .festival-change .fc-sparkle {
	animation: festival-change-twinkle 1.8s ease-in-out infinite;
}

@keyframes festival-change-fly {
	0%, 100% { transform: translate(0, 0) rotate(-4deg); }
	50% { transform: translate(-0.5rem, -0.9rem) rotate(3deg); }
}

@keyframes festival-change-wave {
	0%, 100% { transform: skewY(-6deg) scaleX(1); }
	50% { transform: skewY(7deg) scaleX(1.08); }
}

@keyframes festival-change-twinkle {
	0%, 100% { opacity: 0.2; }
	50% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
	body.forms-portal-dark .festival-rabbit,
	body.forms-portal-dark .festival-rabbit .fr-ear,
	body.forms-portal-dark .festival-osmanthus .fo-bloom,
	body.forms-portal-dark .festival-change,
	body.forms-portal-dark .festival-change .fc-ribbon,
	body.forms-portal-dark .festival-change .fc-sparkle {
		animation: none;
	}
}

@media (max-width: 767px) {
	body.forms-portal-dark .mid-autumn-hero {
		min-height: 8rem;
		padding: 1.5rem 7.2rem 1.5rem 1.25rem;
	}

	body.forms-portal-dark .mid-autumn-hero::before {
		right: 1.2rem;
		width: 5rem;
		height: 5rem;
	}

		body.forms-portal-dark .festival-mooncakes {
			right: 0.5rem;
			transform: scale(0.75);
			transform-origin: bottom right;
		}

		body.forms-portal-dark .festival-rabbit {
			right: 5.2rem;
			transform: scale(0.75);
			transform-origin: bottom right;
		}

		body.forms-portal-dark .festival-osmanthus {
			transform: scale(0.7);
			transform-origin: top right;
		}

		body.forms-portal-dark .festival-change {
			top: 1rem;
			right: 4.2rem;
			transform: scale(0.6);
			transform-origin: top right;
		}

	body.forms-portal-dark .festival-lantern {
		display: none;
	}

	body.forms-portal-dark .mid-autumn-hero::after {
		font-size: 0.7rem;
		letter-spacing: 0.06em;
	}
}
</style>
